server.port=8000
server.error.include-message=always
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sentiprice_db}
spring.datasource.username=${POSTGRES_USER:sentiprice}
spring.datasource.password=${POSTGRES_PASSWORD:sentiprice_dev}
spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=33MB
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/openapi.json
